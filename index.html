<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HannisHub</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --panel: rgba(255,255,255,.05);
      --panel-strong: rgba(255,255,255,.09);
      --border: rgba(255,255,255,.12);
      --text: #eef2ff;
      --muted: #a5b4cf;
      --accent: #7aa2ff;
      --accent-strong: #5578f5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 20%, rgba(122,162,255,.20), transparent 30%),
        radial-gradient(circle at 85% 10%, rgba(99,214,255,.13), transparent 28%),
        var(--bg);
    }
    .shell {
      max-width: 1080px;
      margin: 0 auto;
      padding: 42px 24px 80px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 34px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }
    .brand img {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: rgba(255,255,255,.08);
    }
    .brand h1 {
      margin: 0;
      font-size: 25px;
      letter-spacing: .02em;
    }
    .brand small {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }
    .user-area {
      display: flex;
      align-items: center;
      gap: 12px;
      white-space: nowrap;
    }
    .user {
      color: var(--muted);
      font-size: 14px;
    }
    .button {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 14px;
      cursor: pointer;
      transition: .2s ease;
    }
    .button:hover { background: var(--panel-strong); }
    .section-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .section-title h2 { margin: 0; font-size: 19px; }
    .section-title span { color: var(--muted); font-size: 13px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 18px;
    }
    .card {
      position: relative;
      overflow: hidden;
      display: block;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: linear-gradient(145deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
      text-decoration: none;
      color: inherit;
      transition: .22s ease;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: rgba(122,162,255,.55);
      box-shadow: 0 18px 45px rgba(0,0,0,.28);
    }
    .card-icon {
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      margin-bottom: 18px;
      border-radius: 16px;
      background: rgba(122,162,255,.14);
      font-size: 26px;
    }
    .card h3 { margin: 0 0 10px; font-size: 20px; }
    .card p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
      min-height: 48px;
    }
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 22px;
      color: var(--accent);
      font-size: 14px;
    }
    .arrow { transition: .2s ease; }
    .card:hover .arrow { transform: translateX(4px); }
    .empty {
      padding: 36px;
      border: 1px dashed var(--border);
      border-radius: 18px;
      color: var(--muted);
      text-align: center;
    }
    @media (max-width: 640px) {
      header { align-items: flex-start; flex-direction: column; }
      .shell { padding-top: 28px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand">
        <img src="/icon.png" alt="HannisHub">
        <div>
          <h1>HannisHub</h1>
          <small>综合管理站</small>
        </div>
      </div>
      <div class="user-area">
        <span class="user" id="username">正在读取用户...</span>
        <button class="button" id="logout">退出登录</button>
      </div>
    </header>

    <section>
      <div class="section-title">
        <h2>当前可用服务</h2>
        <span>点击卡片进入对应管理模块</span>
      </div>
      <div class="grid" id="services"></div>
    </section>
  </main>

  <script>
    const servicesBox = document.getElementById("services");
    const usernameText = document.getElementById("username");
    const logoutButton = document.getElementById("logout");

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    async function loadStatus() {
      const response = await fetch("/api/auth/status");
      const data = await response.json();
      usernameText.textContent = data.username || "未登录";
    }

    async function loadServices() {
      const response = await fetch("/api/services");
      const data = await response.json();
      const items = Array.isArray(data.services) ? data.services : [];
      servicesBox.innerHTML = items.length ? items.map(item => `
        <a class="card" href="${escapeHtml(item.path)}">
          <div class="card-icon">${escapeHtml(item.icon || "★")}</div>
          <h3>${escapeHtml(item.name)}</h3>
          <p>${escapeHtml(item.description || "")}</p>
          <div class="card-footer">
            <span>进入服务</span>
            <span class="arrow">→</span>
          </div>
        </a>
      `).join("") : `<div class="empty">暂无可用服务</div>`;
    }

    logoutButton.addEventListener("click", async () => {
      await fetch("/api/auth/logout", { method: "POST" });
      window.location.href = "/login";
    });

    loadStatus();
    loadServices();
  </script>
</body>
</html>
