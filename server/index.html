<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服务器管理 · LlamaManager</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0b1220;
            --panel: #121c2f;
            --panel-soft: #17243a;
            --line: #2b3a55;
            --text: #e9f0fb;
            --muted: #91a2bd;
            --blue: #4e9cff;
            --green: #4fd27a;
            --red: #ff6b7d;
            --orange: #ffb454;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            color: var(--text);
            background: radial-gradient(circle at top right, #172a4d 0, transparent 34%), var(--bg);
            font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        button, input, select, textarea { font: inherit; }
        button { cursor: pointer; }
        .shell { max-width: 1320px; margin: 0 auto; padding: 28px 22px 60px; }
        .topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 26px; }
        .eyebrow { color: var(--blue); font-size: 12px; letter-spacing: .18em; text-transform: uppercase; }
        h1 { margin: 4px 0 3px; font-size: clamp(28px, 4vw, 42px); letter-spacing: -.04em; }
        .subtitle { margin: 0; color: var(--muted); }
        .clock { padding: 9px 13px; border: 1px solid var(--line); border-radius: 10px; color: var(--muted); white-space: nowrap; }
        .grid { display: grid; grid-template-columns: minmax(330px, .75fr) minmax(480px, 1.25fr); gap: 18px; align-items: start; }
        .panel { padding: 20px; border: 1px solid var(--line); border-radius: 16px; background: rgba(18, 28, 47, .92); box-shadow: 0 16px 40px rgba(0,0,0,.16); }
        .panel-wide { grid-column: 1 / -1; }
        .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 15px; }
        h2 { margin: 0; font-size: 18px; }
        h3 { margin: 0; font-size: 15px; }
        .hint { color: var(--muted); font-size: 13px; }
        .form { display: grid; gap: 12px; }
        .field { display: grid; gap: 5px; }
        .field label { color: var(--muted); font-size: 13px; }
        input, select, textarea {
            width: 100%; padding: 10px 11px; border: 1px solid var(--line); border-radius: 9px;
            color: var(--text); background: #0d1728; outline: none;
        }
        textarea { min-height: 92px; resize: vertical; font-family: "SF Mono", Consolas, monospace; font-size: 13px; }
        input:focus, select:focus, textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(78,156,255,.12); }
        .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .three { display: grid; grid-template-columns: 1fr 110px; gap: 10px; }
        .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        .btn { padding: 8px 12px; border: 1px solid transparent; border-radius: 8px; color: white; background: #31415e; }
        .btn:hover { filter: brightness(1.13); }
        .btn:disabled { cursor: wait; opacity: .55; }
        .primary { background: #216ed0; }
        .success { background: #258c50; }
        .danger { background: #a9364b; }
        .ghost { border-color: var(--line); background: transparent; color: var(--muted); }
        .small { padding: 5px 9px; font-size: 12px; }
        .form-status { min-height: 22px; color: var(--muted); font-size: 13px; }
        .form-status.error { color: var(--red); }
        .form-status.ok { color: var(--green); }
        .list { display: grid; gap: 10px; }
        .empty { padding: 28px 10px; color: var(--muted); text-align: center; border: 1px dashed var(--line); border-radius: 10px; }
        .item { padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: rgba(23,36,58,.62); }
        .item-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
        .item-title { min-width: 0; }
        .item-title h3 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .address, code { color: #b8ccef; font-family: "SF Mono", Consolas, monospace; font-size: 12px; word-break: break-all; }
        .meta { display: flex; flex-wrap: wrap; gap: 7px 14px; margin-top: 8px; color: var(--muted); font-size: 12px; }
        .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px; color: #dbeafe; background: #293b5c; font-size: 12px; white-space: nowrap; }
        .badge.ok { color: #c8f8d7; background: rgba(37,140,80,.35); }
        .badge.bad { color: #ffd1d8; background: rgba(169,54,75,.38); }
        .badge.running { color: #ffe3b0; background: rgba(183,109,32,.4); }
        .item-output { margin-top: 10px; padding: 9px; max-height: 150px; overflow: auto; white-space: pre-wrap; color: #b5c3d8; background: #0a1220; border-radius: 8px; font: 12px/1.55 "SF Mono", Consolas, monospace; }
        .weekdays { display: flex; flex-wrap: wrap; gap: 6px; }
        .day { width: 40px; padding: 6px 0; border: 1px solid var(--line); border-radius: 7px; color: var(--muted); background: transparent; }
        .day.selected { border-color: var(--blue); color: white; background: #1d5da6; }
        .disabled { opacity: .48; pointer-events: none; }
        .hidden { display: none !important; }
        .toast { position: fixed; right: 20px; bottom: 20px; z-index: 5; max-width: min(420px, calc(100vw - 40px)); padding: 12px 15px; border: 1px solid var(--line); border-radius: 10px; color: var(--text); background: #1b2942; box-shadow: 0 12px 30px #0008; }
        .toast.error { border-color: #8b3447; background: #391c2a; }
        .footer-note { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
        @media (max-width: 850px) {
            .grid { grid-template-columns: 1fr; }
            .panel-wide, .footer-note { grid-column: auto; }
            .topbar { align-items: flex-start; flex-direction: column; }
        }
        @media (max-width: 480px) { .two, .three { grid-template-columns: 1fr; } .shell { padding: 20px 12px 40px; } }
    </style>
</head>
<body>
<div class="shell">
    <header class="topbar">
        <div>
            <div class="eyebrow">LlamaManager / Remote operations</div>
            <h1>服务器管理</h1>
            <p class="subtitle">连接远程终端，在服务器自己的时区里安排命令。</p>
        </div>
        <div class="clock" id="local-clock">本地时间 --:--:--</div>
    </header>

    <main class="grid">
        <section class="panel">
            <div class="panel-head"><h2 id="connection-form-title">添加服务器连接</h2><button class="btn ghost small hidden" id="cancel-connection">取消编辑</button></div>
            <form class="form" id="connection-form">
                <input type="hidden" id="connection-id">
                <div class="field"><label for="connection-name">名称</label><input id="connection-name" required placeholder="例如：生产 GPU 服务器"></div>
                <div class="two"><div class="field"><label for="connection-host">地址 / 主机名</label><input id="connection-host" required placeholder="192.168.1.20"></div><div class="field"><label for="connection-port">SSH 端口</label><input id="connection-port" type="number" min="1" max="65535" value="22"></div></div>
                <div class="field"><label for="connection-user">用户名</label><input id="connection-user" required placeholder="ubuntu"></div>
                <div class="field"><label for="connection-auth">认证方式</label><select id="connection-auth"><option value="key">私钥文件</option><option value="password">密码</option><option value="agent">SSH Agent</option></select></div>
                <div class="field" id="key-field"><label for="connection-key">私钥路径 <span class="hint">可留空使用默认私钥</span></label><input id="connection-key" placeholder="留空自动尝试 ~/.ssh/id_ed25519、id_rsa 等"></div>
                <div class="field hidden" id="password-field"><label for="connection-password">密码 <span class="hint">（编辑时留空表示保持不变）</span></label><input id="connection-password" type="password" autocomplete="new-password"></div>
                <div class="field"><label for="connection-timezone">服务器时区 <span class="hint">留空则测试连接时自动读取</span></label><input id="connection-timezone" placeholder="Asia/Shanghai"></div>
                <div class="actions"><button class="btn primary" type="submit" id="save-connection">保存连接</button><button class="btn ghost" type="button" id="test-form-connection">保存后测试</button></div>
                <div class="form-status" id="connection-form-status"></div>
            </form>
        </section>

        <section class="panel">
            <div class="panel-head"><div><h2>服务器连接</h2><div class="hint">测试成功后会缓存远端时间和时区</div></div><button class="btn ghost small" id="refresh-connections">刷新</button></div>
            <div class="list" id="connection-list"><div class="empty">正在读取服务器连接…</div></div>
        </section>

        <section class="panel">
            <div class="panel-head"><h2 id="task-form-title">新增定时任务</h2><button class="btn ghost small hidden" id="cancel-task">取消编辑</button></div>
            <form class="form" id="task-form">
                <input type="hidden" id="task-id">
                <div class="field"><label for="task-name">任务名称</label><input id="task-name" required placeholder="例如：每日清理临时文件"></div>
                <div class="field"><label for="task-connection">目标服务器</label><select id="task-connection" required><option value="">请先添加服务器连接</option></select></div>
                <div class="two"><div class="field"><label for="task-schedule">执行周期</label><select id="task-schedule"><option value="daily">每天</option><option value="weekly">每周</option><option value="once">单次</option></select></div><div class="field"><label for="task-time">执行时间（服务器时区）</label><input id="task-time" type="time" value="09:00" required></div></div>
                <div class="field" id="task-date-field"><label for="task-date">开始日期（服务器时区）</label><input id="task-date" type="date" required><div class="hint" id="task-date-hint">每天/每周任务从这一天开始执行；单次任务将在这一天执行。</div></div>
                <div class="field" id="task-weekday-field"><label>每周执行日</label><div class="weekdays" id="weekdays"><button type="button" class="day selected" data-day="0">一</button><button type="button" class="day selected" data-day="1">二</button><button type="button" class="day selected" data-day="2">三</button><button type="button" class="day selected" data-day="3">四</button><button type="button" class="day selected" data-day="4">五</button><button type="button" class="day" data-day="5">六</button><button type="button" class="day" data-day="6">日</button></div></div>
                <div class="field"><label for="task-command">终端命令</label><textarea id="task-command" required placeholder="例如：cd /opt/app && ./backup.sh"></textarea></div>
                <label class="hint"><input id="task-enabled" type="checkbox" checked> 创建后启用任务</label>
                <div class="actions"><button class="btn primary" type="submit" id="save-task">保存任务</button><button class="btn ghost" type="button" id="reset-task">清空</button></div>
                <div class="form-status" id="task-form-status"></div>
            </form>
        </section>

        <section class="panel">
            <div class="panel-head"><div><h2>定时任务</h2><div class="hint">调度器每 15 秒检查一次，任务按目标服务器时区执行</div></div><button class="btn ghost small" id="refresh-tasks">刷新</button></div>
            <div class="list" id="task-list"><div class="empty">正在读取定时任务…</div></div>
        </section>
        <div class="footer-note">提示：密码仅保存在本机 server/settings.json，接口不会返回原始密码。生产环境建议使用 SSH 私钥或 Agent，并限制本管理页的访问范围。</div>
    </main>
</div>
<div class="toast hidden" id="toast"></div>
<script>
    const state = { connections: [], tasks: [] };
    const $ = id => document.getElementById(id);
    const API_PREFIX = window.location.pathname === "/server" || window.location.pathname.startsWith("/server/") ? "/server/api" : "/api";

    function esc(value) {
        return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
    function toast(message, error = false) {
        const node = $("toast"); node.textContent = message; node.className = `toast${error ? " error" : ""}`;
        clearTimeout(toast.timer); toast.timer = setTimeout(() => node.classList.add("hidden"), 4200);
    }
    async function api(method, path, body) {
        const options = { method, headers: { "Content-Type": "application/json" } };
        if (body !== undefined) options.body = JSON.stringify(body);
        const apiPath = path.startsWith("/api/") ? `${API_PREFIX}${path.slice(4)}` : path;
        const response = await fetch(apiPath, options);
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.detail || "请求失败");
        return data;
    }
    function setStatus(id, message, type = "") { const node = $(id); node.textContent = message; node.className = `form-status ${type}`; }
    function formatDate(value, timezone) {
        if (!value) return "未安排";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "未安排";
        return new Intl.DateTimeFormat("zh-CN", { timeZone: timezone || "UTC", dateStyle: "medium", timeStyle: "short" }).format(date);
    }
    function formatLocalTime(value) {
        return value ? new Date(value).toLocaleString("zh-CN") : "尚未测试";
    }
    function todayInTimezone(timezone) {
        const parts = new Intl.DateTimeFormat("en-CA", { timeZone: timezone || Intl.DateTimeFormat().resolvedOptions().timeZone, year: "numeric", month: "2-digit", day: "2-digit" }).formatToParts(new Date());
        const values = Object.fromEntries(parts.filter(part => part.type !== "literal").map(part => [part.type, part.value]));
        return `${values.year}-${values.month}-${values.day}`;
    }
    function selectedConnectionTimezone() { return connectionById($("task-connection").value)?.timezone || Intl.DateTimeFormat().resolvedOptions().timeZone; }
    function updateTaskDateLabel() {
        const once = $("task-schedule").value === "once";
        $("task-date-field").querySelector("label").textContent = once ? "执行日期（服务器时区）" : "开始日期（服务器时区）";
        $("task-date-hint").textContent = once ? "任务将在这一天的指定时间执行。" : "每天/每周任务从这一天开始执行。";
    }
    function connectionById(id) { return state.connections.find(item => item.id === id); }

    function renderConnections() {
        const node = $("connection-list");
        if (!state.connections.length) { node.innerHTML = '<div class="empty">还没有服务器连接，先在左侧添加一台。</div>'; updateConnectionOptions(); return; }
        node.innerHTML = state.connections.map(item => {
            const testBadge = item.last_test_ok === true ? '<span class="badge ok">连接正常</span>' : item.last_test_ok === false ? '<span class="badge bad">连接失败</span>' : '<span class="badge">未测试</span>';
            const time = item.server_time ? `${esc(item.server_time)} · ${esc(item.timezone || "UTC")}` : "尚未读取服务器时间";
            return `<article class="item"><div class="item-top"><div class="item-title"><h3>${esc(item.name)}</h3><div class="address">${esc(item.username)}@${esc(item.host)}:${esc(item.port)}</div></div><div>${testBadge}</div></div><div class="meta"><span>服务器时间：${time}</span><span>认证：${item.auth_type === "key" ? "私钥" : item.auth_type === "password" ? "密码" : "SSH Agent"}</span></div>${item.last_test_message ? `<div class="hint" style="margin-top:6px">${esc(item.last_test_message)}</div>` : ""}<div class="actions" style="margin-top:11px"><button class="btn success small" data-action="test-connection" data-id="${esc(item.id)}">测试连接</button><button class="btn ghost small" data-action="read-time" data-id="${esc(item.id)}">读取时间</button><button class="btn ghost small" data-action="edit-connection" data-id="${esc(item.id)}">编辑</button><button class="btn danger small" data-action="delete-connection" data-id="${esc(item.id)}">删除</button></div></article>`;
        }).join("");
        updateConnectionOptions();
    }
    function updateConnectionOptions() {
        const select = $("task-connection"), current = select.value;
        select.innerHTML = '<option value="">请选择服务器</option>' + state.connections.map(item => `<option value="${esc(item.id)}">${esc(item.name)} · ${esc(item.host)}</option>`).join("");
        if (state.connections.some(item => item.id === current)) select.value = current;
    }
    function resetConnectionForm() {
        $("connection-form").reset(); $("connection-id").value = ""; $("connection-port").value = "22"; $("connection-auth").value = "key";
        $("connection-form-title").textContent = "添加服务器连接"; $("cancel-connection").classList.add("hidden"); setStatus("connection-form-status", ""); toggleAuthFields();
    }
    function editConnection(id) {
        const item = connectionById(id); if (!item) return;
        $("connection-id").value = item.id; $("connection-name").value = item.name || ""; $("connection-host").value = item.host || ""; $("connection-port").value = item.port || 22; $("connection-user").value = item.username || ""; $("connection-auth").value = item.auth_type || "key"; $("connection-key").value = item.private_key_path || ""; $("connection-timezone").value = item.timezone || ""; $("connection-password").value = "";
        $("connection-form-title").textContent = "编辑服务器连接"; $("cancel-connection").classList.remove("hidden"); setStatus("connection-form-status", ""); toggleAuthFields(); window.scrollTo({ top: 0, behavior: "smooth" });
    }
    function toggleAuthFields() { const auth = $("connection-auth").value; $("key-field").classList.toggle("hidden", auth !== "key"); $("password-field").classList.toggle("hidden", auth !== "password"); }

    async function loadConnections() { try { const data = await api("GET", "/api/connections"); state.connections = data.connections || []; renderConnections(); } catch (error) { toast(error.message, true); } }
    async function saveConnection(event) {
        event.preventDefault();
        const id = $("connection-id").value; const auth = $("connection-auth").value; const password = $("connection-password").value;
        const body = { name: $("connection-name").value.trim(), host: $("connection-host").value.trim(), port: Number($("connection-port").value), username: $("connection-user").value.trim(), auth_type: auth, private_key_path: $("connection-key").value.trim(), timezone: $("connection-timezone").value.trim() };
        if (auth === "password" && (password || !id)) body.password = password;
        try { const result = await api(id ? "PUT" : "POST", id ? `/api/connections/${encodeURIComponent(id)}` : "/api/connections", body); setStatus("connection-form-status", "连接已保存", "ok"); toast("服务器连接已保存"); await loadConnections(); if (!id) resetConnectionForm(); else editConnection(result.connection.id); } catch (error) { setStatus("connection-form-status", error.message, "error"); toast(error.message, true); }
    }
    async function testConnection(id, readOnly = false) {
        try { const data = await api("POST", `/api/connections/${encodeURIComponent(id)}/test`); toast(`${data.connection.name}：${data.time.server_time}（${data.time.timezone}）`); await loadConnections(); } catch (error) { toast(error.message, true); await loadConnections(); }
    }
    async function deleteConnection(id) { const item = connectionById(id); if (!item || !confirm(`确定删除“${item.name}”吗？`)) return; try { await api("DELETE", `/api/connections/${encodeURIComponent(id)}`); toast("服务器连接已删除"); await loadConnections(); await loadTasks(); } catch (error) { toast(error.message, true); } }

    function selectedDays() { return [...document.querySelectorAll(".day.selected")].map(node => Number(node.dataset.day)); }
    function renderTasks() {
        const node = $("task-list");
        if (!state.tasks.length) { node.innerHTML = '<div class="empty">还没有定时任务。</div>'; return; }
        node.innerHTML = state.tasks.map(item => {
            const status = item.running ? '<span class="badge running">执行中</span>' : item.last_status === "success" ? '<span class="badge ok">上次成功</span>' : item.last_status === "error" ? '<span class="badge bad">上次失败</span>' : '<span class="badge">等待执行</span>';
            const schedule = item.schedule_type === "daily" ? `每天 ${item.run_time}` : item.schedule_type === "weekly" ? `每周 ${item.weekdays.map(day => "一二三四五六日"[day]).join("、")} ${item.run_time}` : `单次 ${item.run_date} ${item.run_time}`;
            const output = item.last_output ? `<div class="item-output">${esc(item.last_output)}</div>` : "";
            return `<article class="item"><div class="item-top"><div class="item-title"><h3>${esc(item.name)}</h3><div class="address"><code>${esc(item.connection_name)}</code> · ${esc(item.timezone || "UTC")}</div></div><div>${item.enabled ? status : '<span class="badge">已停用</span>'}</div></div><div class="meta"><span>计划：${esc(schedule)}</span><span>下次：${esc(formatDate(item.next_run_at, item.timezone))}</span>${item.last_run_at ? `<span>上次：${esc(formatLocalTime(item.last_run_at))}</span>` : ""}</div><div class="hint" style="margin-top:6px">命令：<code>${esc(item.command)}</code></div>${item.last_message ? `<div class="hint" style="margin-top:5px">${esc(item.last_message)}</div>` : ""}${output}<div class="actions" style="margin-top:11px"><button class="btn success small" data-action="run-task" data-id="${esc(item.id)}" ${item.running ? "disabled" : ""}>立即执行</button><button class="btn ghost small" data-action="edit-task" data-id="${esc(item.id)}" ${item.running ? "disabled" : ""}>编辑</button><button class="btn danger small" data-action="delete-task" data-id="${esc(item.id)}" ${item.running ? "disabled" : ""}>删除</button></div></article>`;
        }).join("");
    }
    function resetTaskForm() { $("task-form").reset(); $("task-id").value = ""; $("task-time").value = "09:00"; $("task-date").value = todayInTimezone(selectedConnectionTimezone()); $("task-enabled").checked = true; $("task-schedule").value = "daily"; document.querySelectorAll(".day").forEach((node, index) => node.classList.toggle("selected", index < 5)); $("task-form-title").textContent = "新增定时任务"; $("cancel-task").classList.add("hidden"); setStatus("task-form-status", ""); toggleScheduleFields(); }
    function editTask(id) { const item = state.tasks.find(task => task.id === id); if (!item) return; $("task-id").value = item.id; $("task-name").value = item.name || ""; $("task-connection").value = item.connection_id || ""; $("task-schedule").value = item.schedule_type || "daily"; $("task-time").value = item.run_time || "09:00"; $("task-date").value = item.run_date || ""; $("task-command").value = item.command || ""; $("task-enabled").checked = item.enabled !== false; document.querySelectorAll(".day").forEach(node => node.classList.toggle("selected", (item.weekdays || []).includes(Number(node.dataset.day)))); $("task-form-title").textContent = "编辑定时任务"; $("cancel-task").classList.remove("hidden"); setStatus("task-form-status", ""); toggleScheduleFields(); window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" }); }
    function toggleScheduleFields() { const type = $("task-schedule").value; $("task-weekday-field").classList.toggle("hidden", type !== "weekly"); updateTaskDateLabel(); }
    async function loadTasks() { try { const data = await api("GET", "/api/tasks"); state.tasks = data.tasks || []; renderTasks(); } catch (error) { toast(error.message, true); } }
    async function saveTask(event) { event.preventDefault(); const id = $("task-id").value; const body = { name: $("task-name").value.trim(), connection_id: $("task-connection").value, schedule_type: $("task-schedule").value, run_time: $("task-time").value, run_date: $("task-date").value, weekdays: selectedDays(), command: $("task-command").value.trim(), enabled: $("task-enabled").checked }; try { await api(id ? "PUT" : "POST", id ? `/api/tasks/${encodeURIComponent(id)}` : "/api/tasks", body); toast("定时任务已保存"); resetTaskForm(); await loadTasks(); } catch (error) { setStatus("task-form-status", error.message, "error"); toast(error.message, true); } }
    async function runTask(id) { try { await api("POST", `/api/tasks/${encodeURIComponent(id)}/run`); toast("任务已派发，正在连接服务器"); await loadTasks(); setTimeout(loadTasks, 1800); } catch (error) { toast(error.message, true); } }
    async function deleteTask(id) { const item = state.tasks.find(task => task.id === id); if (!item || !confirm(`确定删除“${item.name}”吗？`)) return; try { await api("DELETE", `/api/tasks/${encodeURIComponent(id)}`); toast("定时任务已删除"); await loadTasks(); } catch (error) { toast(error.message, true); } }

    document.addEventListener("DOMContentLoaded", () => {
        $("connection-form").addEventListener("submit", saveConnection); $("task-form").addEventListener("submit", saveTask); $("connection-auth").addEventListener("change", toggleAuthFields); $("task-schedule").addEventListener("change", toggleScheduleFields); $("task-connection").addEventListener("change", () => { if (!$("task-id").value) $("task-date").value = todayInTimezone(selectedConnectionTimezone()); }); $("cancel-connection").addEventListener("click", resetConnectionForm); $("cancel-task").addEventListener("click", resetTaskForm); $("reset-task").addEventListener("click", resetTaskForm); $("refresh-connections").addEventListener("click", loadConnections); $("refresh-tasks").addEventListener("click", loadTasks);
        $("test-form-connection").addEventListener("click", async () => { const id = $("connection-id").value; if (!id) { setStatus("connection-form-status", "请先保存连接，再测试", "error"); return; } await testConnection(id); });
        $("weekdays").addEventListener("click", event => { const button = event.target.closest(".day"); if (button) button.classList.toggle("selected"); });
        document.addEventListener("click", event => { const button = event.target.closest("[data-action]"); if (!button) return; const id = button.dataset.id; const action = button.dataset.action; if (action === "edit-connection") editConnection(id); if (action === "delete-connection") deleteConnection(id); if (action === "test-connection" || action === "read-time") testConnection(id); if (action === "edit-task") editTask(id); if (action === "delete-task") deleteTask(id); if (action === "run-task") runTask(id); });
        setInterval(() => { $("local-clock").textContent = `本地时间 ${new Date().toLocaleTimeString("zh-CN", { hour12: false })}`; }, 1000); $("local-clock").textContent = `本地时间 ${new Date().toLocaleTimeString("zh-CN", { hour12: false })}`;
        toggleAuthFields(); toggleScheduleFields(); resetTaskForm(); loadConnections().then(loadTasks); setInterval(loadTasks, 15000); setInterval(loadConnections, 30000);
    });
</script>
</body>
